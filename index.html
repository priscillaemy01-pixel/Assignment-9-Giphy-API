<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fetch a GIF</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container py-4">
      <label for="search-input" class="form-label">Search for GIFs</label>
      <input id="search-input" type="search" class="form-control mb-3">
      <button id="fetch-gif" type="button" class="btn btn-primary mb-3">
        Fetch a GIF
      </button>
      <p id="search-status" role="status" aria-live="polite"></p>
      <div id="gif-container" class="row"></div>
    </main>
  </body>
</html>
